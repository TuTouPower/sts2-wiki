<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>杀戮尖塔 2 图鉴 · STS2 Wiki</title>
<meta name="description" content="《杀戮尖塔2》卡牌 / 遗物 / 敌人 / 角色图鉴，含胜率、选取率等实战统计数据。数据来源：游民星空图鉴。">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗼</text></svg>">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-icon">🗼</span>
      <div class="brand-text">
        <h1>杀戮尖塔 2 图鉴</h1>
        <p class="brand-sub">Slay the Spire 2 Wiki</p>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="search" placeholder="搜索中文名 / 英文名…" autocomplete="off">
      </div>
      <button id="themeToggle" class="theme-btn" type="button" aria-label="切换深色/亮色模式">🌙</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="cards" type="button">卡牌 <span class="tab-count" data-count="cards"></span></button>
    <button class="tab" data-tab="relics" type="button">遗物 <span class="tab-count" data-count="relics"></span></button>
    <button class="tab" data-tab="enemies" type="button">敌人 <span class="tab-count" data-count="enemies"></span></button>
    <button class="tab" data-tab="characters" type="button">角色 <span class="tab-count" data-count="characters"></span></button>
  </nav>
  <div class="filterbar" id="filterbar"></div>
</header>

<main class="container">
  <p class="result-meta" id="resultMeta"></p>
  <div class="grid" id="grid"></div>
  <div class="char-wrap" id="charWrap" hidden></div>
  <p class="empty" id="emptyTip" hidden>没有符合条件的结果，试试放宽筛选。</p>
</main>

<footer class="footer">
  <p>数据抓取自 <a href="https://www.gamersky.com/tools/sts2wiki/" target="_blank" rel="noopener">游民星空《杀戮尖塔2》图鉴</a>，统计口径为该站大数据胜率统计；游戏版权归 Mega Crit 所有。本站为非官方粉丝项目，仅供查阅。</p>
  <p class="footer-sub" id="dataStamp"></p>
</footer>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" type="button" aria-label="关闭">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
